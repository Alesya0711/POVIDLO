const timers=new Map();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(applications))}catch(e){storageAvailable=false;toast('Браузер не разрешил сохранение. Данные доступны до закрытия страницы.')}}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3600)}
function badge(a){return `<span class="badge ${a.status}">${statusNames[a.status]}</span>`}
function now(){return new Date().toISOString()}
function addEvent(a,title,detail=''){a.history.unshift({title,detail,date:now()})}
function current(){return applications.find(a=>a.id===selectedId)}
function monthly(d){const r=.225/12,n=Number(d.months),s=Number(d.amount);return s*r/(1-Math.pow(1+r,-n))}
function score(d){const margin=Number(d.revenue)-Number(d.expenses),load=(Number(d.debt)+monthly(d))/Math.max(margin,1);let points=78;const factors=[];if(Number(d.age)>=24){points+=10;factors.push(['Бизнес работает больше двух лет','+10',false])}else{points-=15;factors.push(['Короткая история бизнеса','−15',true])}if(margin>0&&load<.5){points+=8;factors.push(['Платёж покрывается доходом','+8',false])}else{points-=30;factors.push(['Высокая нагрузка на свободный доход','−30',true])}if(d.overdue==='yes'){points-=45;factors.push(['Есть просроченные обязательства','−45',true])}else{points+=4;factors.push(['Просрочки не указаны','+4',false])}return {points:Math.max(0,Math.min(100,Math.round(points))),load,margin,factors}}
function outcome(d){const s=score(d);if(d.overdue==='yes'||s.points<40)return 'rejected';if(s.points<70||Number(d.age)<24)return 'review';return 'approved'}
function decide(a){a.score=score(a.data);a.status=outcome(a.data);addEvent(a,a.status==='approved'?'Кредит одобрен':a.status==='review'?'Передано сотруднику':'Принято отрицательное решение',a.status==='review'?'Автоматической оценки недостаточно.':a.status==='approved'?'Предложены демонстрационные условия.':'Заявка не соответствует демонстрационным правилам.');persist();if(view==='detail'&&selectedId===a.id||view==='home'||view==='queue')render()}
function schedule(a){if(timers.has(a.id))return;const delay=Math.max(300,new Date(a.submittedAt).getTime()+2600-Date.now());timers.set(a.id,setTimeout(()=>{timers.delete(a.id);if(a.status==='checking')decide(a)},delay))}
function navigate(next,id){view=next;if(id)selectedId=id;render();window.scrollTo(0,0);document.getElementById('page-title')?.focus({preventScroll:true})}
function footer(){return `<footer class="bottomnote"><span>Учебный прототип · Синтетические данные · Условия демонстрационные</span><span>${storageAvailable?'Сохранение в этом браузере':'Сохранение недоступно'} · Без реальных операций</span></footer>`}
function pagehead(title,subtitle,action=''){return `<div class="pagehead"><div><h1 id="page-title" tabindex="-1">${title}</h1><p>${subtitle}</p></div>${action}</div>`}
function companyPanel(){return `<section class="panel pad"><div class="side-title"><span class="eyebrow muted">Ваш бизнес</span>${icon('building')}</div><h3 class="profile-title">ООО «Лист и кофе»</h3><p class="muted small">Кофейня и обжарка · Москва</p><div class="facts" style="margin-top:24px"><div class="fact"><span>Статус компании</span><b style="color:var(--green)">Действующая</b></div><div class="fact"><span>На рынке</span><b>3 года</b></div><div class="fact"><span>Данные</span><b>Демонстрационные</b></div></div></section>`}
function home(){return pagehead('Финансирование бизнеса','Всё о ваших кредитах — в одном месте.',`<button class="btn red" data-action="products">${icon('plus')}Новая заявка</button>`)+`<div class="grid"><div><section class="feature"><span class="eyebrow" style="color:#785747">Для следующего шага</span><h2>Большие планы.<br>Деньги на их реализацию.</h2><p>Закупите товар, обновите оборудование или откройте новую точку.</p><button class="btn" data-action="products">Подобрать финансирование ${icon('arrow')}</button><div class="feature-art" aria-hidden="true"><b>А_</b><strong>бизнес</strong><span>Ваш следующий шаг</span></div></section><section class="panel"><div class="panel-head"><h3>Мои заявки <span class="muted small">${applications.length?` · ${applications.length}`:''}</span></h3><span class="muted small">Обновляется автоматически</span></div>${applications.length?applications.map(a=>`<button class="application-row" data-open="${a.id}"><span class="app-icon">${icon('file')}</span><span class="row-main"><b>${esc(a.data.company)}</b><p>Оборотный кредит · № ${a.id}</p></span><span class="row-money num">${rub(a.data.amount)}<br>${badge(a)}</span></button>`).join(''):`<div class="empty divider"><div class="app-icon">${icon('file')}</div><div><h3>Здесь появится ваша первая заявка</h3><p class="muted small">Выберите продукт, заполните данные и следите за решением.</p><button class="link-btn" data-action="products">Начать оформление →</button></div></div>`}</section></div><aside class="aside-grid">${companyPanel()}<section class="help"><h3>От идеи до решения</h3><p class="mini-note">Не нужно разбираться во внутренних процессах банка. Мы подскажем следующий шаг.</p><ul><li>Заполните данные о бизнесе</li><li>Отправьте заявку на проверку</li><li>Получите результат в кабинете</li></ul><button class="link-btn" data-action="demo">Заполнить пример заявки →</button></section></aside></div>`}
function products(){return pagehead('Выберите финансирование','Начните с задачи, которую хотите решить.')+`<div class="products"><section class="panel product"><div class="app-icon">${icon('credit')}</div><span class="eyebrow muted" style="margin-bottom:12px">Полный сценарий в демо</span><h2>На оборотные средства</h2><p>Для закупки товара, расчётов с поставщиками и повседневных задач.</p><div class="product-values num"><div><b>до 10 млн ₽</b><span>сумма кредита</span></div><div><b>до 36 мес.</b><span>срок</span></div></div><button class="btn red" data-action="start">Оформить заявку ${icon('arrow')}</button></section><section class="panel product"><div class="app-icon">${icon('building')}</div><span class="eyebrow muted" style="margin-bottom:12px">Следующий этап развития</span><h2>На развитие бизнеса</h2><p>Оборудование, ремонт и открытие новых точек. Этот продукт пока не входит в демо.</p><div class="product-values num"><div><b>Индивидуально</b><span>условия финансирования</span></div></div><span class="badge draft" style="align-self:start;margin-top:26px">Скоро в прототипе</span></section></div><div class="callout">${icon('info')}Параметры продуктов придуманы для демонстрации. Они не являются предложением Альфа-Банка.</div>`}
function input(name,label,type='number',extra='',hint=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(draft[name])}" ${extra} required>${hint?`<small>${hint}</small>`:''}</label>`}
function form(){const fromInfo=draftId&&applications.find(a=>a.id===draftId)?.status==='needs_info';return `<button class="link-btn header-back" data-action="home">← В кабинет</button>`+pagehead(fromInfo?'Дополните заявку':'Заявка на оборотный кредит','Три шага — и заявка отправится на рассмотрение.')+`<div class="grid"><section class="panel pad"><div class="stepper">${['Условия','О бизнесе','Проверка'].map((s,i)=>`<div class="${i===step?'current':i<step?'done':''}"><span class="stepnum">${i<step?'✓':i+1}</span><span>${s}</span></div>`).join('')}</div><form id="credit-form"><div class="form-intro"><h2>${['На что нужны деньги?','Расскажите о компании','Всё верно?'][step]}</h2><p>${['Выберите комфортные сумму и срок.','Эти данные помогут оценить возможность финансирования.','Проверьте данные перед отправкой.'][step]}</p></div>${step===0?`<div class="fields">${input('amount','Сумма кредита, ₽','number','min="100000" max="10000000" step="10000"','От 100 000 до 10 000 000 ₽')}<label class="field">Срок кредита<select name="months">${[6,12,18,24,36].map(n=>`<option value="${n}" ${Number(draft.months)===n?'selected':''}>${n} месяцев</option>`).join('')}</select></label><label class="field full">Цель финансирования<select name="purpose">${['Закупка товара','Расчёты с поставщиками','Текущие расходы','Расширение ассортимента'].map(v=>`<option ${draft.purpose===v?'selected':''}>${v}</option>`).join('')}</select></label></div>`:step===1?`<div class="fields">${input('company','Название компании','text','maxlength="100"')}${input('inn','ИНН — синтетический','text','inputmode="numeric" pattern="[0-9]{10}|[0-9]{12}" maxlength="12"','10 или 12 цифр; реестр в демо не проверяется')}${input('age','Возраст бизнеса, месяцев','number','min="1" max="1200"')}${input('revenue','Средний доход за месяц, ₽','number','min="1" max="1000000000"')}${input('expenses','Средние расходы за месяц, ₽','number','min="0" max="1000000000"')}${input('debt','Платежи по другим кредитам в месяц, ₽','number','min="0" max="1000000000"')}<label class="field full">Есть просроченные платежи?<select name="overdue"><option value="no" ${draft.overdue==='no'?'selected':''}>Нет</option><option value="yes" ${draft.overdue==='yes'?'selected':''}>Да</option></select></label><label class="field full">Комментарий к заявке <span class="muted">(необязательно)</span><textarea name="comment" maxlength="1000" placeholder="Например, пояснение к финансовым показателям">${esc(draft.comment)}</textarea></label></div><div class="callout">${icon('shield')}Для демо используйте вымышленные данные. Проверки компании и кредитной истории имитируются.</div>`:`<dl class="summary-list"><div><dt>Компания</dt><dd>${esc(draft.company)}</dd></div><div><dt>ИНН</dt><dd>${esc(draft.inn)}</dd></div><div><dt>Сумма</dt><dd class="num">${rub(draft.amount)}</dd></div><div><dt>Срок</dt><dd>${draft.months} месяцев</dd></div><div><dt>Цель</dt><dd>${esc(draft.purpose)}</dd></div><div><dt>Возраст бизнеса</dt><dd>${draft.age} мес.</dd></div><div><dt>Доход / месяц</dt><dd class="num">${rub(draft.revenue)}</dd></div><div><dt>Расходы / месяц</dt><dd class="num">${rub(draft.expenses)}</dd></div><div><dt>Другие кредиты / месяц</dt><dd>${rub(draft.debt)}</dd></div><div><dt>Просрочки</dt><dd>${draft.overdue==='yes'?'Есть':'Нет'}</dd></div>${draft.comment?`<div><dt>Комментарий</dt><dd>${esc(draft.comment)}</dd></div>`:''}</dl><label class="checklabel"><input type="checkbox" name="confirmed" required><span>Проверил данные и понимаю, что это учебная демонстрация без реальных банковских операций.</span></label>`}<div id="form-error" class="field-error" role="alert"></div><div class="form-actions"><button type="button" class="btn light" data-action="${step?'prev':'save'}">${step?'Назад':'Сохранить черновик'}</button><button class="btn red" type="submit">${step===2?'Отправить заявку':'Продолжить'} ${icon('arrow')}</button></div></form></section><aside><section class="panel pad"><span class="eyebrow muted">Оборотный кредит</span><div class="summary-money num" id="summary-amount">${rub(draft.amount)}</div><p class="muted small" id="summary-months">на ${draft.months} месяцев</p><div class="estimate"><span class="muted small">Примерный платёж в месяц</span><strong class="num" id="summary-payment">${rub(monthly(draft))}</strong><p class="mini-note" style="margin-top:8px">Расчёт по демонстрационной ставке 22,5% годовых. Итоговые условия появятся после рассмотрения.</p></div></section><section class="help"><h3>Можно продолжить позже</h3><p class="mini-note">Черновик автоматически сохраняется при изменении полей в этом браузере.</p><p class="saved" id="save-state" style="margin-top:12px">${draftId?'✓ Черновик сохранён':'Начните заполнение'}</p></section></aside></div>`}
function detail(){const a=current();if(!a)return home();if(role==='client'&&a.status==='draft'){draft={...a.data};draftId=a.id;step=0;view='form';return form()}const s=a.score||score(a.data);const approved=a.status==='approved',bank=role==='bank';const title={checking:'Проверяем вашу заявку',approved:'Можно двигаться дальше',rejected:'Сейчас не можем одобрить',review:'Нужно чуть больше внимания',needs_info:'Нужны дополнительные сведения'}[a.status];const desc={checking:'Сведения приняты. Проверяем компанию и рассчитываем оценку риска. Результат появится автоматически.',approved:'Для вашего бизнеса одобрено финансирование на следующих демонстрационных условиях.',rejected:a.clientReason||'По текущим данным заявка не проходит демонстрационные правила. '+(a.data.overdue==='yes'?'Причина: указаны просроченные обязательства.':'Причина: высокая нагрузка на свободный доход или недостаточная история бизнеса.'),review:'Заявка передана сотруднику для дополнительного рассмотрения. Результат появится здесь.',needs_info:a.request||'Пожалуйста, уточните финансовые показатели и добавьте комментарий.'}[a.status];return `<button class="link-btn header-back" data-action="${bank?'queue':'home'}">← ${bank?'К очереди заявок':'Мои заявки'}</button>`+pagehead(`Заявка № ${a.id}`,`${esc(a.data.company)} · Оборотный кредит`,badge(a))+`<div class="grid"><div><section class="panel"><div class="pad"><span class="eyebrow muted">Путь заявки</span><div class="journey">${[['Отправлена','Данные получены'],['Проверки','Компания и финансы'],['Рассмотрение','Оценка и решение'],['Результат','Условия и действия']].map(([t,d],i)=>`<div class="journey-step ${i<(a.status==='checking'?1:['review','needs_info'].includes(a.status)?2:4)?'done':i===(a.status==='checking'?1:2)?'current':''}"><b>${t}</b><small class="muted">${d}</small></div>`).join('')}</div></div><div class="result ${a.status}"><div class="result-icon ${a.status==='checking'?'pulse':''}">${icon(approved?'check':a.status==='rejected'?'x':a.status==='needs_info'?'file':'clock')}</div><div><h2>${title}</h2><p>${esc(desc)}</p>${approved?`<div class="terms num"><div><b>${rub(a.data.amount)}</b><small>сумма кредита</small></div><div><b>22,5%</b><small>годовых · демо</small></div><div><b>${rub(monthly(a.data))}</b><small>платёж / месяц</small></div></div><p class="small" style="margin-top:20px">Здесь основной сценарий демо завершён. Подписание и выдача денег не реализованы.</p>`:''}${a.status==='needs_info'&&!bank?'<button class="btn" data-action="amend">Дополнить заявку →</button>':''}</div></div></section><section class="panel pad" style="margin-top:22px"><h3>Данные заявки</h3><dl class="summary-list" style="margin-top:22px"><div><dt>Сумма и срок</dt><dd>${rub(a.data.amount)} · ${a.data.months} мес.</dd></div><div><dt>Цель</dt><dd>${esc(a.data.purpose)}</dd></div><div><dt>Компания</dt><dd>${esc(a.data.company)}</dd></div><div><dt>ИНН</dt><dd>${esc(a.data.inn)}</dd></div>${bank?`<div><dt>Доход / расходы в месяц</dt><dd>${rub(a.data.revenue)} / ${rub(a.data.expenses)}</dd></div><div><dt>Другие платежи по кредитам</dt><dd>${rub(a.data.debt)} / мес.</dd></div>`:''}${a.data.comment?`<div><dt>Комментарий клиента</dt><dd>${esc(a.data.comment)}</dd></div>`:''}</dl></section>${bank&&['review','needs_info'].includes(a.status)?`<section class="panel pad" style="margin-top:22px"><h3>Рассмотрение заявки</h3><p class="mini-note" style="margin-top:8px">Учебная роль: действия меняют результат в клиентском кабинете. Реальной авторизации в демо нет.</p>${a.status==='review'?`<label class="field" style="margin-top:16px">Сообщение клиенту для уточнения<textarea class="bank-comment" id="bank-comment" maxlength="1000" placeholder="Какие сведения необходимо дополнить?">Уточните средние расходы и платежи по действующим кредитам. Добавьте пояснение в комментарии.</textarea></label><div class="bank-actions"><button class="btn" data-decision="approved">Одобрить</button><button class="btn light" data-decision="needs_info">Запросить сведения</button><button class="btn ghost" data-decision="rejected">Отказать</button></div>`:'<div class="callout">Ожидаем дополнения от клиента. После повторной отправки начнётся новая проверка.</div>'}</section>`:''}<section class="panel pad" style="margin-top:22px"><h3>История заявки</h3><ol class="timeline" style="margin-top:12px">${a.history.map(h=>`<li><div>${esc(h.title)}${h.detail?`<p>${esc(h.detail)}</p>`:''}</div><time datetime="${h.date}">${new Date(h.date).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</time></li>`).join('')}</ol></section></div><aside class="aside-grid">${bank?`<section class="panel pad"><div class="side-title"><span class="eyebrow muted">Скоринг · демомодель</span>${icon('shield')}</div>${a.status==='checking'?'<p class="muted small pulse">Рассчитываем оценку…</p>':`<div class="score-row num"><strong>${s.points}</strong><span>/ 100 баллов</span></div><span class="badge ${s.points>=70?'approved':s.points>=40?'review':'rejected'}">${s.points>=70?'Низкий':s.points>=40?'Средний':'Высокий'} риск</span><div class="score-meter" aria-label="Оценка ${s.points} из 100">${Array.from({length:10},(_,i)=>`<i class="${i<Math.round(s.points/10)?'filled':''}"></i>`).join('')}</div><p class="mini-note">Чем выше балл, тем ниже оценённый риск.</p><div style="margin-top:15px">${s.factors.map(f=>`<div class="factor"><span>${f[0]}</span><b class="${f[2]?'bad':''}">${f[1]}</b></div>`).join('')}</div><div class="callout">Балльные правила на синтетических данных. Оценка не является реальной моделью банка.</div>`}</section>`:`<section class="panel pad"><div class="side-title"><span class="eyebrow muted">Что дальше</span>${icon('info')}</div><h3>${approved?'Решение уже в кабинете':a.status==='needs_info'?'Дополните данные':'Мы сохранили вашу заявку'}</h3><p class="mini-note" style="margin-top:12px">${approved?'В полноценном продукте здесь появятся документы и переход к подписанию.':a.status==='needs_info'?'Вернитесь в форму, исправьте сведения и отправьте их на повторную проверку.':'Вы можете закрыть страницу и вернуться позже. Повторно вводить данные не потребуется.'}</p></section>`}<section class="${bank?'panel pad':'help'}" ${bank?'style="margin-top:20px"':''}><h3>${bank?'Результаты проверок':'Посмотреть изнутри'}</h3>${bank?`<div class="checks" style="margin-top:19px">${['Компания — локальный симулятор','Кредитная история — симулятор','Финансовые данные — из формы'].map(t=>`<div class="checkitem">${icon(a.status==='checking'?'clock':'check')}<span>${t}</span></div>`).join('')}</div><p class="mini-note" style="margin-top:17px">Запросы к реальным реестрам не выполняются.</p>`:`<p class="mini-note" style="margin-top:10px">В режиме сотрудника видны проверки, скоринговый балл и причины решения по этой заявке.</p><button class="link-btn" data-action="bank-detail">Открыть кабинет банка →</button>`}</section></aside></div>`}
function queue(){const list=applications.filter(a=>a.status!=='draft');return pagehead('Очередь заявок','Единый процесс: от клиентской заявки до кредитного решения.',`<button class="btn light" data-action="demo-review">${icon('plus')}Пример для рассмотрения</button>`)+`<div class="bank-stats num"><div><b>${list.length}</b><span>Всего заявок</span></div><div><b>${list.filter(a=>a.status==='review').length}</b><span>На рассмотрении</span></div><div><b>${list.filter(a=>a.status==='approved').length}</b><span>Одобрено</span></div></div><section class="panel"><div class="bank-tools"><input id="queue-search" aria-label="Поиск по компании или номеру" placeholder="Поиск по компании или номеру" value="${esc(search)}"><select id="queue-filter" aria-label="Фильтр заявок"><option value="all">Все статусы</option>${Object.entries(statusNames).filter(([k])=>k!=='draft').map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="tablewrap" id="queue-table">${queueTable()}</div></section><div class="callout">${icon('info')}Переключатель сверху нужен для демонстрации двух сторон продукта. В рабочей версии доступ сотрудников проверяется на сервере.</div>`}
function queueTable(){const list=applications.filter(a=>a.status!=='draft'&&(filter==='all'||a.status===filter)&&(a.data.company+' '+a.id).toLowerCase().includes(search.toLowerCase()));return list.length?`<table><thead><tr><th>Компания / заявка</th><th>Сумма</th><th>Скоринг</th><th>Статус</th><th><span class="sr-only">Действие</span></th></tr></thead><tbody>${list.map(a=>`<tr><td><b>${esc(a.data.company)}</b><p>№ ${a.id} · ${a.data.months} мес.</p></td><td class="num">${rub(a.data.amount)}</td><td class="num">${a.score?a.score.points+' / 100':'—'}</td><td>${badge(a)}</td><td><button class="link-btn" data-open="${a.id}">Открыть →</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty divider"><div class="app-icon">'+icon('file')+'</div><div><h3>Заявок пока нет</h3><p class="muted small">Создайте заявку в кабинете предпринимателя или загрузите пример.</p></div></div>'}
function render(){document.getElementById('role-client').setAttribute('aria-pressed',role==='client');document.getElementById('role-bank').setAttribute('aria-pressed',role==='bank');document.getElementById('account-name').textContent=role==='bank'?'Анна · Кредитный специалист':'ООО «Лист и кофе»';document.getElementById('account-caption').textContent=role==='bank'?'Рабочее место сотрудника':'Кабинет предпринимателя';document.getElementById('avatar').textContent=role==='bank'?'АК':'ЛК';document.getElementById('nav').innerHTML=role==='bank'?`<button class="active" data-action="queue">${icon('grid')}Очередь заявок</button>`:`<button class="${view==='home'||view==='detail'?'active':''}" data-action="home">${icon('grid')}Мои заявки</button><button class="${view==='products'||view==='form'?'active':''}" data-action="products">${icon('credit')}Кредитные продукты</button>`;const content=view==='form'?form():view==='products'?products():view==='queue'?queue():view==='detail'?detail():home();document.getElementById('main').innerHTML=`<div class="screen">${content}</div>${footer()}`;const f=document.getElementById('credit-form');if(f){f.addEventListener('submit',submitForm);f.addEventListener('input',onFormInput);f.addEventListener('change',onFormInput)}document.getElementById('queue-search')?.addEventListener('input',e=>{search=e.target.value;document.getElementById('queue-table').innerHTML=queueTable()});document.getElementById('queue-filter')?.addEventListener('change',e=>{filter=e.target.value;document.getElementById('queue-table').innerHTML=queueTable()})}
function collect(){const f=document.getElementById('credit-form');if(!f)return;for(const [k,v]of new FormData(f).entries()){if(k==='confirmed')continue;draft[k]=['amount','months','age','revenue','expenses','debt'].includes(k)?Number(v):v}}
function newId(){return String(Date.now()).slice(-7)+Math.floor(Math.random()*90+10)}
function saveDraft(announce=false){collect();let a=applications.find(a=>a.id===draftId);if(!a){a={id:newId(),data:{...draft},status:'draft',history:[]};applications.unshift(a);draftId=a.id}else a.data={...draft};persist();const el=document.getElementById('save-state');if(el)el.textContent=storageAvailable?'✓ Черновик сохранён':'Сохранение недоступно';if(announce)toast(storageAvailable?'Черновик сохранён. Можно вернуться позже.':'Сохранение недоступно в этом браузере.')}
function onFormInput(){saveDraft();const amount=document.getElementById('summary-amount');if(amount)amount.textContent=rub(draft.amount||0);const months=document.getElementById('summary-months');if(months)months.textContent='на '+draft.months+' месяцев';const payment=document.getElementById('summary-payment');if(payment)payment.textContent=Number.isFinite(monthly(draft))?rub(monthly(draft)):'—'}
function submitForm(e){e.preventDefault();collect();const error=document.getElementById('form-error');if(step===1&&!draft.company.trim()){error.textContent='Укажите название компании.';return}saveDraft();if(step<2){step++;render();document.getElementById('page-title')?.focus({preventScroll:true});window.scrollTo(0,0);return}let a=applications.find(a=>a.id===draftId);a.data={...draft};a.status='checking';a.submittedAt=now();a.score=null;addEvent(a,a.history.length?'Данные отправлены повторно':'Заявка отправлена','Начаты демонстрационные проверки.');persist();schedule(a);selectedId=a.id;draftId=null;step=0;navigate('detail',a.id);toast('Заявка принята. Начинаем проверку.')}
function start(data=defaultData()){draft={...data};draftId=null;step=0;role='client';navigate('form')}
function bankDecision(value){const a=current();if(!a||a.status!=='review')return;if(value==='needs_info'){const text=document.getElementById('bank-comment').value.trim();if(!text){toast('Напишите, какие сведения нужно дополнить.');return}a.request=text}a.status=value;a.clientReason=value==='rejected'?'Отрицательное решение принято сотрудником в демонстрационном сценарии.':'';addEvent(a,value==='approved'?'Одобрено сотрудником':value==='rejected'?'Отказ по итогам рассмотрения':'Запрошены дополнительные сведения',value==='needs_info'?a.request:'Решение принято в демонстрационном кабинете сотрудника.');persist();render();toast('Статус обновлён в обоих кабинетах.')}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.role){role=el.dataset.role;view=role==='bank'?'queue':'home';render();return}if(el.dataset.open){navigate('detail',el.dataset.open);return}if(el.dataset.decision){bankDecision(el.dataset.decision);return}const action=el.dataset.action;if(['home','products','queue'].includes(action)){navigate(action);return}if(action==='start'||action==='demo')start();if(action==='save')saveDraft(true);if(action==='prev'){collect();saveDraft();step=Math.max(0,step-1);render()}if(action==='amend'){const a=current();draft={...a.data};draftId=a.id;step=1;navigate('form')}if(action==='bank-detail'){role='bank';navigate('detail',selectedId)}if(action==='demo-review'){const a={id:newId(),data:{...defaultData(),company:'ООО «Пекарня на углу»',age:15},status:'review',history:[]};a.score=score(a.data);addEvent(a,'Передано сотруднику','Короткая история бизнеса — требуется ручное рассмотрение.');applications.unshift(a);persist();navigate('detail',a.id)}});
window.addEventListener('storage',e=>{if(e.key!==KEY||view==='form')return;try{const next=JSON.parse(e.newValue||'[]');if(Array.isArray(next)){applications=next;applications.filter(a=>a.status==='checking').forEach(schedule);render()}}catch{}});
applications.filter(a=>a.status==='checking').forEach(schedule);render();
</script>
</body>
